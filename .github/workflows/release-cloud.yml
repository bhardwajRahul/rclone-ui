name: release-cloud

# Releases the cloud branch, and only the cloud branch. Run it by hand ("Run workflow"): it builds
# cloud's latest commit at the version in its Cargo.toml, tags that commit cloud-v<version>, and
# publishes the binaries, the update manifest and the container image.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Picks the commit to release, cloud's latest, which every job then builds, and reads its version.
  # Creates the release and its tag on that commit. A version that is already released is refused:
  # bump Cargo.toml on cloud to release again.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.cloud.outputs.sha }}
      short: ${{ steps.cloud.outputs.short }}
      version: ${{ steps.cloud.outputs.version }}
      tag: ${{ steps.cloud.outputs.tag }}
    steps:
      - name: The cloud branch and its version
        id: cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/cloud" --jq .sha)"
          version="$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$sha" \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
          if [ -z "$version" ]; then
            echo "::error::no version in Cargo.toml at $sha"
            exit 1
          fi
          tag="cloud-v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already released; bump the version in Cargo.toml on cloud"
            exit 1
          fi
          echo "Releasing $tag from cloud at $sha"
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Create the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cloud.outputs.tag }}
          target_commitish: ${{ steps.cloud.outputs.sha }}
          make_latest: false

  binaries:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-14
            target: macos-aarch64
          - os: macos-13
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p out/cloud
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/rclone-cloud.exe out/cloud/rclone-cloud-${{ matrix.target }}.exe
          else
            cp target/release/rclone-cloud out/cloud/rclone-cloud-${{ matrix.target }}
          fi
      # Signs each binary with the minisign key in TAURI_SIGNING_PRIVATE_KEY. The server's updater
      # (src/updater.rs) checks that signature before it installs an update.
      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in out/cloud/rclone-cloud-*; do
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          ls -la out/cloud
      - uses: actions/upload-artifact@v4
        with:
          name: rclone-cloud-${{ matrix.target }}
          path: out/cloud/*
      # Attached to this version's release. The repository's Latest stays the desktop app's, which
      # its updater reads from `releases/latest/download/latest.json`.
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: out/cloud/*
          make_latest: false

  # Writes `cloud-latest.json`, which a running rclone-cloud reads to update itself: one entry per
  # platform (`cloud-<os>-<arch>`) with the binary's URL and signature. It goes on this version's
  # release and on the rolling `cloud-latest` release, whose URL never changes.
  manifest:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rclone-cloud-*
          path: artifacts
          merge-multiple: true
      - name: Write cloud-latest.json
        shell: bash
        env:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          platforms="{}"
          for sig in artifacts/*.sig; do
            bin="${sig%.sig}"
            name="$(basename "$bin")"
            key="${name#rclone-cloud-}"
            key="cloud-${key%.exe}"
            platforms="$(jq --arg k "$key" --arg u "${base}/${name}" --arg s "$(cat "$sig")" \
              '.[$k] = {url: $u, signature: $s}' <<<"$platforms")"
          done
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "See the release notes on GitHub.", pub_date: $d, platforms: $p}' \
            > cloud-latest.json
          cat cloud-latest.json
      - name: Keep it with the version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: cloud-latest.json
          make_latest: false
      - name: Point the rolling release at it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-latest
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Rclone Cloud update pointer
          body: |
            Not a version. `cloud-latest.json` is what a running rclone-cloud reads to find its
            newest release; the binaries are on the `cloud-v*` releases.
          files: cloud-latest.json
          make_latest: false

  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rclone-cloud
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=raw,value=sha-${{ needs.prepare.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
